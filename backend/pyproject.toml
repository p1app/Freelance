[project]
name = "freelance-lite"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "p1app", email = "ramazan.kazimagomedov2008@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.4",
    "passlib[argon2]>=1.7.4",
    "fastapi-jwt-harmony>=0.3.1",
    "celery>=5.6.3",
    "redis>=8.1.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "fastapi-structured-logging>=1.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "pytest-asyncio>=1.4.0",
    "ty>=0.0.84",
    "httpx2>=2.13.1",
    "bandit>=1.9.4",
]


[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:.*Accessing argon2.__version__ is deprecated:DeprecationWarning"
]

[tool.ruff.lint.isort]
known-first-party = ["core", "models", "repository", "routers", "schemas", "service", "websocket", "main"]

[tool.ruff]
exclude = [
    ".git",
    ".venv",
    "venv",
    "env",
    "__pycache__",
    "build",
    "dist",
    "migration"
]

[tool.ty.analysis]
respect-type-ignore-comments = true

[tool.ty.environment]
root = ["./src"]
