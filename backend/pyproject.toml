[project]
name = "freelance-lite"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "p1app", email = "ramazan.kazimagomedov2008@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
    "passlib[argon2]>=1.7.4",
    "fastapi-jwt-harmony>=0.3.1",
    "celery>=5.6.3",
    "redis>=8.1.0",

]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "pytest-asyncio>=1.4.0",
    "httpx2>=2.13.1",
    "anyio>=4.14.2",
]


[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:.*Accessing argon2.__version__ is deprecated:DeprecationWarning"
]
