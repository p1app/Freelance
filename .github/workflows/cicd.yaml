name: 'CI_CD' 
on:
  workflow_dispatch:
  push:
    branches: main

jobs:
    lint:
      runs-on: ubuntu-22.04
      steps:
        - uses: actions/checkout@v7
        - name: 'Install uv'
          uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        - name: 'Linting with ruff'
          run: uv run --directory backend ruff check ./src ./tests
        - name: 'Check error with ty'
          run: uv run --directory backend ty check ./src ./tests
    test:
      runs-on: ubuntu-22.04
      needs: lint
      environment: 'test'
      services:
        postgres:
          image: postgres:16-alpine
          env:
            POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASS }}
            POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
            POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          ports: 
            - 5432:5432
          options: --health-cmd pg_isready --health-interval 10s  --health-timeout 5s --health-retries 5
        redis:
          image: redis:8-alpine
          ports:
            - 6379:6379
      steps:
        - uses: actions/checkout@v7
        - name: 'Create env_file'
          run: |
            touch ./backend/.env
            echo '${{ secrets.API_ENV_FILE }}' > ./backend/.env
        - name: 'Install uv'
          uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        - name: 'Run test'
          run: uv run --directory backend pytest
