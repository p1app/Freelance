name: 'CI_CD' 
on:
  workflow_dispatch:
  push:
    branches: main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: 'Install uv'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: 'uv sync'
        run: uv sync --directory backend --dev --frozen
      - name: 'Linting with ruff'
        run: uv run --directory backend ruff check ./src ./tests
      - name: 'Check error with ty'
        run: uv run --directory backend ty check ./src ./tests


  test:
    runs-on: ubuntu-22.04
    needs: lint
    environment: 'test'
    env:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASS }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports: 
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d freelance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5      
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1m30s 
          --health-timeout 30s 
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - name: 'Create env_file'
        env:
          API_ENV_CONTENT: ${{ secrets.API_ENV_FILE }}
        run: |
          printf '%s' "$API_ENV_CONTENT" > ./backend/.env
      - name: 'Install uv'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: 'uv sync'
        run: uv sync --directory backend --dev --frozen
      - name: 'Run test'
        run: uv run --directory backend pytest
  
  
  build-and-push:
    env:
      REGISTRY_GITHUB: ghcr.io
      REGISTRY_DOCKERHUB: docker.io
    strategy:
      matrix:
        include:
          - build-directory: backend
            IMAGE_NAME: p1app/freelance_backend
          - build-directory: frontend
            IMAGE_NAME: p1app/freelance_frontend
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v7
      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v4
      - name: Login in ghcr
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GITHUB }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login in docker.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_DOCKERHUB }}
          username: ${{ secrets.DOCKER_USERNAME}}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY_GITHUB }}/${{ matrix.IMAGE_NAME }}
            ${{ env.REGISTRY_DOCKERHUB }}/${{ matrix.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.build-directory }}
          file: ./${{ matrix.build-directory }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max