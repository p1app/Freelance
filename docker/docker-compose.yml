services:
  backend:
    image: p1app/freelance_backend
    container_name: backend
    expose:
      - 8000
    env_file:
      - env/backend.env
    restart: unless-stopped
    networks:
      - freelance
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()" ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    depends_on:
      worker:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: p1app/freelance_frontend
    container_name: frontend
    ports:
      - "5173:80"
    env_file:
      - env/frontend.env
    restart: unless-stopped
    networks:
      - freelance
    depends_on:
      backend:
        condition: service_healthy
  worker:
    image: p1app/freelance_backend
    container_name: worker
    entrypoint: []
    env_file:
      - env/backend.env
    environment:
      - PYTHONPATH=src
    command: [ "uv", "run", "celery", "-A", "core.email_message", "worker", "-l", "INFO" ]
    restart: unless-stopped
    networks:
      - freelance
    depends_on:
      redis:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    container_name: db
    expose:
      - 5432
    env_file:
      - env/pg.env
    networks:
      - freelance
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d freelance" ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  redis:
    image: redis:8-alpine
    container_name: redis
    networks:
      - freelance
    ports:
      - 6379
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    networks:
      - freelance
    expose:
      - 9090
    volumes:
      - ./prometheus_data/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'


  grafana:
    image: grafana/grafana:13.0-slim
    container_name: grafana
    networks:
      - freelance
    ports:
      - 3000:3000
    volumes:
      - grafana_data:/var/lib/grafana


volumes:
  prometheus_data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ./prometheus_data
  
  grafana_data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ./grafana_data
  
  pgdata:
    name: freelance_pgdata
    # external: true

networks:
  freelance:
    driver: bridge